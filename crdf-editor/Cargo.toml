[package]
name = "crdf-editor"
version = "0.1.0"
license.workspace = true
repository.workspace = true
description = "A visual RDF graph editor powered by crdf and egui."
documentation = "https://docs.rs/crdf-editor/"
edition.workspace = true
readme = "README.md"
keywords = ["rdf", "crdt", "egui", "graph", "editor"]
categories = ["visualization", "gui"]

[dependencies]
crdf = { version = "0.1.0", path = "../crdf" }
crdf-dpo = { version = "0.1.0", path = "../crdf-dpo" }
eframe = { version = "=0.36.1", default-features = false, features = [
    "accesskit",
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "=0.36.1", default-features = false }
rfd = { version = "0.17.2", optional = true }

[features]
default = ["native-dialog", "default-fonts"]
native-dialog = ["dep:rfd"]
default-fonts = ["eframe/default_fonts", "egui/default_fonts"]

[dev-dependencies]
egui_kittest = { version = "=0.36.1", features = ["eframe"] }
